name: ci
on:
  push:
  pull_request:

jobs:
  rust-tests:
    name: rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # the sandbox tests run the installed renderer through `sh`, so they only exist here
            extra: ""
          - os: windows-latest
            # nothing compiles the Windows-only privilege path until a release is tagged, so build it on
            # every push. --no-run because linking is what catches a broken windows branch, and a test
            # binary is one more thing that can miss a runtime dll on a runner
            extra: "--no-run"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # no npm build needed first: the tests only touch the rust side
      - run: cargo test --manifest-path src-tauri/Cargo.toml ${{ matrix.extra }}

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
